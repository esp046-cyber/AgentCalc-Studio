<body>
<header class="top"><img src="images/logo-championship.svg" alt="Create AI Agents Championship" height="32"><strong class="brand">AgentCalc Studio</strong>
<span class="sp"></span><span id="off" class="pill" hidden>Offline</span><button id="install" class="btn" hidden>Install app</button>
<button id="cmdk" class="btn ghost" aria-label="Search (Ctrl K)">⌘K</button><button id="vault" class="btn ghost">Vault</button><button id="settings" class="btn ghost">Settings</button><button id="partner" class="btn ghost" aria-label="Championship and partner alignment">Partners</button>
<button id="theme" class="btn ghost" aria-label="Toggle dark mode">◐</button></header>
<nav id="nav" role="tablist" aria-label="Modules">
<button role="tab" data-t="build" aria-selected="true">Builder</button><button role="tab" data-t="calc" aria-selected="false">Calculators</button>
<button role="tab" data-t="gloss" aria-selected="false">Glossary</button><button role="tab" data-t="brief" aria-selected="false">Pitch canvas</button></nav>
<main>
<section id="build" role="tabpanel"></section>
<section id="calc" role="tabpanel" hidden></section>
<section id="gloss" role="tabpanel" hidden></section>
<section id="brief" role="tabpanel" hidden></section>
<footer><img src="images/logo-championship.svg" alt="" height="28"> <img src="images/logo-dubai-chamber.svg" alt="An initiative by Dubai Chamber Digital" height="28">
<p>Design an Agent That Matters — turn your idea into impact. Validate cost, ROI and market before you build.</p>
<button id="export" class="btn ghost">Export PWA icon pack</button></footer></main>
<dialog id="dlg"><div id="dlgb"></div><button class="btn" onclick="dlg.close()">Close</button></dialog>
<div id="toast" role="status" hidden></div>
<script src="js/glossary.js"></script><script src="js/calculators.js"></script><script src="js/visual-builder.js"></script><script src="js/app.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{r.onupdatefound=()=>{const w=r.installing;w.onstatechange=()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('New version ready — reload to update.')}}}))</script>
</body></html>
